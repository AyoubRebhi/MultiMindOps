artifact_type: dockerfile

metadata:
  framework: generic
  language: generic
  strategy: multi_stage
  version: v1

sections:
  - id: base_image
    required: true
    description: Base image appropriate for the detected language and framework
    template: |
      FROM {{ base_image }}
    required_variables:
      - base_image
    rag_tags:
      - base-image
      - multi-stage-build
    security_rules:
      - use_specific_tag

  - id: workdir
    required: true
    description: Application working directory
    template: |
      WORKDIR {{ workdir }}
    required_variables:
      - workdir

  - id: build_dependencies
    required: true
    description: Copy dependency descriptor and install dependencies
    template: |
      COPY {{ dependency_file }} .
      RUN {{ install_command }}
    required_variables:
      - dependency_file
      - install_command
    rag_tags:
      - layer-caching
      - dependency-management

  - id: security_user_create
    required: false
    description: |
      Create the non-root user/group BEFORE copying the source so that
      COPY --chown can resolve the user, and so that the runtime-dirs
      step can chown the workdir to it.
    template: |
      RUN {{ create_user_command }}
    required_variables:
      - create_user_command
    rag_tags:
      - non-root-user
      - security-hardening

  - id: source_code
    required: true
    description: Copy application source code with non-root ownership
    static: true
    template: |
      COPY --chown={{ app_user }}:{{ app_group }} . .

  - id: runtime_dirs
    required: false
    description: |
      Pre-create runtime-writable application directories and align ownership BEFORE
      switching to USER. Required so non-root processes can mkdir/write inside the
      WORKDIR at runtime.
    template: |
      RUN mkdir -p {{ workdir }}/logs {{ workdir }}/tmp && \
          chown -R {{ app_user }}:{{ app_group }} {{ workdir }}
    required_variables:
      - workdir
      - app_user
      - app_group
    rag_tags:
      - runtime-permissions
      - non-root-user

  - id: security
    required: false
    description: Drop privileges to the non-root user created above
    template: |
      USER {{ app_user }}
    required_variables:
      - app_user
    rag_tags:
      - non-root-user
      - security-hardening

  - id: expose
    required: true
    description: Declare application port
    template: |
      EXPOSE {{ port }}
    required_variables:
      - port
    validation_hints:
      - port_must_be_numeric

  - id: healthcheck
    required: false
    description: Container health probe
    template: |
      HEALTHCHECK --interval={{ healthcheck_interval }} --timeout={{ healthcheck_timeout }} --retries={{ healthcheck_retries }} \
        CMD {{ healthcheck_cmd }}
    required_variables:
      - healthcheck_interval
      - healthcheck_timeout
      - healthcheck_retries
      - healthcheck_cmd
    rag_tags:
      - healthcheck

  - id: startup
    required: true
    description: Application startup command
    template: |
      CMD {{ startup_command }}
    required_variables:
      - startup_command
    rag_tags:
      - startup-command
      - exec-form

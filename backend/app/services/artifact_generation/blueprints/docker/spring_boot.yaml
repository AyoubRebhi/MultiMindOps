artifact_type: dockerfile

metadata:
  framework: spring_boot
  language: java
  strategy: multi_stage
  version: v1

sections:
  - id: builder_base
    required: true
    description: JDK builder image with Maven or Gradle for compilation
    template: |
      FROM {{ builder_image }} AS builder
    required_variables:
      - builder_image
    rag_tags:
      - java-jdk-image
      - maven-builder
      - multi-stage-build
    security_rules:
      - use_specific_tag
      - prefer_temurin_or_eclipse

  - id: build_workdir
    required: true
    description: Builder stage working directory
    static: true
    template: |
      WORKDIR /build

  - id: build_dependencies
    required: true
    description: Copy build descriptor and pre-fetch dependencies for layer caching
    template: |
      COPY {{ build_file }} .
      RUN {{ dependency_cache_command }}
    required_variables:
      - build_file
      - dependency_cache_command
    rag_tags:
      - maven-dependency-cache
      - gradle-dependency-cache
      - layer-caching

  - id: copy_source
    required: true
    description: Copy full source tree for compilation
    static: true
    template: |
      COPY src ./src

  - id: build
    required: true
    description: Compile and package the application JAR
    template: |
      RUN {{ build_command }}
    required_variables:
      - build_command
    rag_tags:
      - maven-package
      - gradle-build
      - skip-tests

  - id: runtime_base
    required: true
    description: Minimal JRE runtime image (no compiler or build tools)
    template: |
      FROM {{ runtime_image }} AS runtime
    required_variables:
      - runtime_image
    rag_tags:
      - java-jre-image
      - minimal-runtime
      - distroless-java
    security_rules:
      - use_specific_tag
      - prefer_jre_over_jdk

  - id: security_user
    required: false
    description: Create non-root user and group (distro-aware — Debian uses groupadd/useradd, Alpine uses addgroup/adduser)
    template: |
      RUN {{ create_user_command }}
    required_variables:
      - create_user_command
    rag_tags:
      - non-root-user
      - least-privilege
      - security-hardening
    validation_hints:
      - debian_uses_groupadd_useradd
      - alpine_uses_addgroup_adduser

  - id: workdir
    required: true
    description: Application runtime working directory
    template: |
      WORKDIR {{ workdir }}
    required_variables:
      - workdir

  - id: copy_jar
    required: true
    description: Copy compiled JAR from builder stage with non-root ownership
    template: |
      COPY --chown=appuser:appgroup --from=builder /build/{{ jar_path }} app.jar
    required_variables:
      - jar_path
    rag_tags:
      - multi-stage-copy-jar
      - non-root-ownership

  - id: expose
    required: true
    description: Declare the port Spring Boot listens on
    template: |
      EXPOSE {{ port }}
    required_variables:
      - port
    validation_hints:
      - port_must_be_numeric

  - id: runtime_dirs
    required: true
    description: |
      Pre-create runtime-writable application directories and align ownership BEFORE
      switching to USER appuser. The JVM and Spring Boot frequently write to /tmp
      and /app/logs (e.g. heap dumps, file appenders) — those writes fail when /app
      is owned by root and the process runs as appuser.
    static: true
    template: |
      RUN mkdir -p /app/logs /app/tmp && \
          chown -R appuser:appgroup /app
    security_rules:
      - runtime_writable_dirs
      - ownership_alignment
    rag_tags:
      - runtime-permissions
      - non-root-user

  - id: user
    required: false
    description: Switch to non-root user
    static: true
    template: |
      USER appuser

  - id: healthcheck
    required: false
    description: Spring Boot Actuator health check probe
    template: |
      HEALTHCHECK --interval={{ healthcheck_interval }} --timeout={{ healthcheck_timeout }} --retries={{ healthcheck_retries }} \
        CMD {{ healthcheck_cmd }}
    required_variables:
      - healthcheck_interval
      - healthcheck_timeout
      - healthcheck_retries
      - healthcheck_cmd
    rag_tags:
      - spring-actuator-healthcheck

  - id: startup
    required: true
    description: JVM startup with the packaged JAR (must be JSON exec-form with double quotes)
    template: |
      ENTRYPOINT {{ startup_command }}
    required_variables:
      - startup_command
    rag_tags:
      - java-jar-entrypoint
      - jvm-flags
    validation_hints:
      - exec_form_double_quotes_only
      - example: '["java", "-jar", "app.jar"]'

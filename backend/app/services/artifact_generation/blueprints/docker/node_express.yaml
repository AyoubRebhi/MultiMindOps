artifact_type: dockerfile

metadata:
  framework: node_express
  language: javascript
  strategy: multi_stage
  version: v1

sections:
  - id: builder_base
    required: true
    description: Node.js builder image for dependency installation
    template: |
      FROM {{ builder_image }} AS builder
    required_variables:
      - builder_image
    rag_tags:
      - node-base-image
      - multi-stage-build
    security_rules:
      - use_specific_tag
      - prefer_alpine

  - id: build_workdir
    required: true
    description: Builder working directory
    static: true
    template: |
      WORKDIR /build

  - id: build_dependencies
    required: true
    description: Install production dependencies with npm ci for reproducibility
    template: |
      COPY {{ package_files }} .
      RUN {{ install_command }}
    required_variables:
      - package_files
      - install_command
    rag_tags:
      - npm-ci
      - node-layer-caching
      - production-dependencies

  - id: runtime_base
    required: true
    description: Minimal Node.js runtime image
    template: |
      FROM {{ runtime_image }} AS runtime
    required_variables:
      - runtime_image
    rag_tags:
      - node-slim-image
      - alpine-runtime
    security_rules:
      - use_specific_tag
      - prefer_alpine

  - id: security_user
    required: false
    description: |
      Create non-root user for Alpine-based images. The -h /home/appuser flag
      ensures a writable home directory exists for runtime caches.
    static: true
    template: |
      RUN addgroup -S appgroup && adduser -S -h /home/appuser -G appgroup appuser

  - id: workdir
    required: true
    description: Application working directory in runtime image
    template: |
      WORKDIR {{ workdir }}
    required_variables:
      - workdir

  - id: copy_dependencies
    required: true
    description: Copy installed node_modules from builder stage with non-root ownership
    static: true
    template: |
      COPY --chown=appuser:appgroup --from=builder /build/node_modules ./node_modules

  - id: copy_source
    required: true
    description: Copy application source code with non-root ownership
    static: true
    template: |
      COPY --chown=appuser:appgroup . .

  - id: expose
    required: true
    description: Declare the port the Node application listens on
    template: |
      EXPOSE {{ port }}
    required_variables:
      - port
    validation_hints:
      - port_must_be_numeric

  - id: runtime_dirs
    required: true
    description: |
      Pre-create runtime-writable application directories and align ownership BEFORE
      switching to USER appuser. Node apps commonly write to ./logs and ./tmp at
      runtime — those mkdir calls fail when /app is root-owned and the process runs
      as appuser.
    static: true
    template: |
      RUN mkdir -p /app/logs /app/tmp && \
          chown -R appuser:appgroup /app
    security_rules:
      - runtime_writable_dirs
      - ownership_alignment
    rag_tags:
      - runtime-permissions
      - non-root-user

  - id: user
    required: false
    description: Drop privileges to non-root user
    static: true
    template: |
      USER appuser

  - id: healthcheck
    required: false
    description: HTTP health check using wget (Alpine-compatible)
    template: |
      HEALTHCHECK --interval={{ healthcheck_interval }} --timeout={{ healthcheck_timeout }} --retries={{ healthcheck_retries }} \
        CMD {{ healthcheck_cmd }}
    required_variables:
      - healthcheck_interval
      - healthcheck_timeout
      - healthcheck_retries
      - healthcheck_cmd
    rag_tags:
      - node-healthcheck
      - wget-probe

  - id: startup
    required: true
    description: Node.js application startup command
    template: |
      CMD {{ startup_command }}
    required_variables:
      - startup_command
    rag_tags:
      - node-startup
      - exec-form

# Continuous delivery workflow generated by the DevSecOps AI Platform.
# Target: Amazon EKS - test, build the image, push to ECR and roll the
# Kubernetes deployment.
#
# Runs on every push to main. It performs application delivery ONLY: it never
# runs Terraform. Infrastructure is provisioned ONCE by the companion
# bootstrap.yml; this workflow assumes the EKS cluster already exists.
#
# Source of truth: this template. The image is built from Dockerfile.
name: Deploy tp-devops to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Serialize deployments — a newer push supersedes an in-flight one.
concurrency:
  group: deployment
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: d96e-49b7-4499-8472-c79ca134c376
  EKS_CLUSTER: d96e-49b7-4499-8472-c79ca134c376
  K8S_DEPLOYMENT: tp-devops
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        # Auto-detect the project toolchain from well-known marker files and run
        # its test command. Non-blocking (continue-on-error) so a project without
        # a test suite still delivers. Detection order matters: Angular before the
        # generic Node check (an Angular repo also has package.json).
        continue-on-error: true
        run: |
          if [ -f pom.xml ]; then
            echo "Detected Maven (Spring Boot) project — running 'mvn test'"
            mvn -B test
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "Detected Gradle project — running 'gradle test'"
            ./gradlew test || gradle test
          elif [ -f angular.json ]; then
            echo "Detected Angular project — running 'npm test --watch=false'"
            npm ci
            npm test -- --watch=false
          elif [ -f package.json ]; then
            echo "Detected Node project — running 'npm test'"
            npm ci
            npm test
          elif [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then
            echo "Detected Python project — running 'pytest'"
            pip install -r requirements.txt 2>/dev/null || true
            pytest
          else
            echo "No recognised test toolchain found — skipping tests"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -f Dockerfile .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Deploy to Amazon EKS
        # Rolling update: point the deployment at the freshly pushed image and
        # wait for the rollout to complete.
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          kubectl set image "deployment/$K8S_DEPLOYMENT" \
            "$K8S_DEPLOYMENT=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          kubectl rollout restart "deployment/$K8S_DEPLOYMENT"
          kubectl rollout status "deployment/$K8S_DEPLOYMENT" --timeout=300s

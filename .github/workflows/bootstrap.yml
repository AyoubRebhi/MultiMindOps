# Bootstrap (infrastructure) workflow generated by the DevSecOps AI Platform.
# Target: Amazon EKS - provision infrastructure with Terraform, build the image,
# push it to ECR and perform the FIRST deployment to the cluster.
#
# Run this ONCE (manually) to stand the environment up. Continuous delivery on
# every push is handled by the separate deploy.yml — this workflow is NOT push
# triggered so application changes never re-run `terraform apply`.
#
# Source of truth: this template. Infrastructure is provisioned by the Terraform
# under terraform/ and the image is built from Dockerfile.
name: Bootstrap tp-devops on EKS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: d96e-49b7-4499-8472-c79ca134c376
  EKS_CLUSTER: d96e-49b7-4499-8472-c79ca134c376
  K8S_DEPLOYMENT: tp-devops
  TERRAFORM_DIR: terraform
  IMAGE_TAG: ${{ github.sha }}

jobs:
  bootstrap:
    name: Provision and first deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -auto-approve -input=false

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -f Dockerfile .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: First deployment to Amazon EKS
        # Applies manifests under k8s/ when present, then rolls the deployment to
        # the freshly pushed image and waits for the rollout to complete.
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          if [ -d k8s ]; then kubectl apply -f k8s/; fi
          kubectl set image "deployment/$K8S_DEPLOYMENT" \
            "$K8S_DEPLOYMENT=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          kubectl rollout status "deployment/$K8S_DEPLOYMENT" --timeout=300s

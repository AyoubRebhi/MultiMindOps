name: Spring Boot CI
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: |
          if [ -f mvnw ]; then chmod +x mvnw && ./mvnw test; else mvn test; fi
      - name: Package application
        run: |
          if [ -f mvnw ]; then ./mvnw -DskipTests package; else mvn -DskipTests package; fi

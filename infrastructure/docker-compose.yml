version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: devsecops_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devsecops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: python:3.11-slim
    container_name: devsecops_backend
    working_dir: /app
    volumes:
      - ../:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - postgres

volumes:
  postgres_data: